aid: trishula-therapeutics
name: Trishula Therapeutics
description: Trishula Therapeutics is a privately held, clinical-stage immuno-oncology company developing
  cancer immunotherapies that target immune-evasion mechanisms in the tumor microenvironment. Its lead
  candidate, TTX-030, is a first-in-class monoclonal antibody that inhibits CD39, an enzyme in the adenosine
  pathway that tumors exploit to suppress anti-tumor immunity; TTX-030 has advanced into Phase 2 clinical
  trials, including studies in metastatic pancreatic cancer. The company was surfaced through the API
  Evangelist network as a portfolio company of Canaan Partners. It is a therapeutics company with a corporate
  web presence and no public API, developer, or software product surface.
